  home:
    page_title: "Porównanie kredytów hipotecznych"
    seo:
      variable:
        title: "Porównywarka kredytów hipotecznych — oprocentowanie zmienne i WIBOR 3M"
        description: "Kalkulator hipoteczny i porównanie ofert kredytowych ze zmienną stopą (marża + WIBOR 3M): raty, ubezpieczenia, nadpłaty i całkowity koszt spłaty."
      fixed_period:
        title: "Porównanie ofert kredytowych — oprocentowanie stałe | wCredit.pl"
        description: "Porównywarka kredytów hipotecznych ze stałą stopą na pierwsze lata, potem zmienna. Ranking rat, ubezpieczeń i łącznego kosztu w bankach."
    hero:
      title: "Porównywarka kredytów hipotecznych"
      subtitle: "Kalkulator hipoteczny do porównania ofert banków: rata, części płatności, oprocentowanie zmienne lub stałe oraz wpływ nadpłat."
    comparison_guide:
      title: "Jak porównać oferty kredytów hipotecznych"
      intro: "wCredit.pl to <strong>porównywarka kredytów hipotecznych</strong> i <strong>kalkulator hipoteczny</strong> oparty na aktualnych ofertach banków w Polsce."
      calculator:
        title: "Kalkulator hipoteczny"
        body: "Podaj <strong>kwotę kredytu</strong> i <strong>okres spłaty</strong>, a następnie sprawdź, jak zmienia się rata przy <strong>nadpłatach</strong>. To szybki sposób, by oszacować miesięczny koszt przed wyborem banku."
      comparison:
        title: "Porównanie ofert kredytowych"
        body: "Wyniki to <strong>ranking kredytów</strong> według rzeczywistych warunków ofert: rata kredytowa, ubezpieczenia, prowizja i łączna suma spłaty. Przy każdej ofercie widać, z jakich części składa się płatność."
      rates:
        title: "Oprocentowanie zmienne, stałe i WIBOR 3M"
        body: "Wybierz <strong>oprocentowanie zmienne</strong> (marża + <strong>WIBOR 3M</strong> lub 1M) albo <strong>oprocentowanie stałe</strong> na pierwsze lata. Porównanie pokazuje różnice w racie i koszcie w zależności od typu stopy."
      best_bank:
        title: "W jakim banku najlepiej wziąć kredyt hipoteczny?"
        body: "Nie ma jednej odpowiedzi dla wszystkich. Najlepszy wybór zależy od <strong>łącznego kosztu</strong>, typu oprocentowania, opłat i Twojej zdolności. Porównaj oferty poniżej i sprawdź szczegóły raty zamiast polegać na ogólnym rankingu."
