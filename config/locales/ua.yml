  home:
    page_title: "Порівняння іпотечних кредитів"
    seo:
      variable:
        title: "Порівняння іпотеки — змінна ставка та WIBOR 3M"
        description: "Іпотечний калькулятор і порівняння пропозицій банків зі змінною ставкою (маржа + WIBOR 3M): платежі, страхування, дострокове погашення та повна вартість."
      fixed_period:
        title: "Порівняння кредитних пропозицій — фіксована ставка | wCredit.pl"
        description: "Порівняйте іпотеку з фіксованою ставкою на перші роки, далі змінна. Рейтинг платежів, страхування та повної вартості в банках."
    hero:
      title: "Порівняння іпотечних кредитів у Польщі"
      subtitle: "Іпотечний калькулятор для порівняння пропозицій банків: частини платежу, змінна чи фіксована ставка та вплив дострокового погашення."
    comparison_guide:
      title: "Як порівнювати іпотечні пропозиції"
      intro: "wCredit.pl — це <strong>порівняння іпотечних кредитів</strong> та <strong>іпотечний калькулятор</strong> на основі актуальних пропозицій банків у Польщі."
      calculator:
        title: "Іпотечний калькулятор"
        body: "Вкажіть <strong>суму кредиту</strong> і <strong>термін</strong>, а потім перевірте, як змінюється платіж при <strong>достроковому погашенні</strong>. Швидкий спосіб оцінити щомісячну вартість перед вибором банку."
      comparison:
        title: "Порівняння кредитних пропозицій"
        body: "Результати — це <strong>рейтинг кредитів</strong> за реальними умовами: кредитний платіж, страхування, комісії та повна сума погашення. У кожній пропозиції видно, з яких частин складається платіж."
      rates:
        title: "Змінна ставка, фіксована ставка та WIBOR 3M"
        body: "Оберіть <strong>змінну ставку</strong> (маржа + <strong>WIBOR 3M</strong> або 1M) або <strong>фіксовану ставку</strong> на перші роки. Порівняння показує, як тип ставки впливає на платіж і повну вартість."
      best_bank:
        title: "В якому банку найкраще взяти іпотечний кредит?"
        body: "Універсальної відповіді немає. Найкращий вибір залежить від <strong>повної вартості</strong>, типу ставки, комісій і вашої ситуації. Порівняйте пропозиції нижче та перевірте деталі платежу замість загального рейтингу."
    form:
