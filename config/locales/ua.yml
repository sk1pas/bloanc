    description: "Ми використовуємо необхідні файли cookie, щоб сайт працював коректно (наприклад сесія та безпека). Додаткові аналітичні чи маркетингові cookie вмикаємо лише за вашою згодою. Ви можете прийняти всі або залишити лише необхідні."
    accept: "Прийняти всі"
    reject: "Лише необхідні"
  actions:
    back: "Назад"
    show: "Показати"
    edit: "Редагувати"
    delete: "Видалити"
